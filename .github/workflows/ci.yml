name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Static Code Analysis
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore lint environment cache
        id: lint-cache
        uses: actions/cache@v4
        with:
          path: .venv-lint
          key: ${{ runner.os }}-py311-lint-${{ hashFiles('requirements/runtime.txt') }}
          restore-keys: |
            ${{ runner.os }}-py311-lint-

      - name: Create lint environment and install dependencies
        if: steps.lint-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv .venv-lint
          .\.venv-lint\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-lint\Scripts\python.exe -m pip install -r requirements/runtime.txt flake8 pylint

      - name: Run flake8 (style & syntax check)
        shell: pwsh
        run: .\.venv-lint\Scripts\python.exe -m flake8 main.py stm32_easy_flash/

      - name: Run pylint (code quality check)
        shell: pwsh
        run: >
          .\.venv-lint\Scripts\python.exe -m pylint main.py stm32_easy_flash/
          --fail-under=7.0
          --disable=import-error

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore test environment cache
        id: test-cache
        uses: actions/cache@v4
        with:
          path: .venv-test
          key: ${{ runner.os }}-py311-test-${{ hashFiles('requirements/test.txt') }}
          restore-keys: |
            ${{ runner.os }}-py311-test-

      - name: Create test environment and install dependencies
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv-test
          .venv-test/bin/python -m pip install --upgrade pip
          .venv-test/bin/python -m pip install -r requirements/test.txt

      - name: Run pytest
        run: .venv-test/bin/python -m pytest tests/ -v --tb=short

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: [lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore build environment cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: .venv-build
          key: ${{ runner.os }}-py311-build-${{ hashFiles('requirements/build.txt', 'stm32_easy_flash.spec') }}
          restore-keys: |
            ${{ runner.os }}-py311-build-

      - name: Create build environment and install dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-build\Scripts\python.exe -m pip install -r requirements/build.txt

      - name: Build .exe with PyInstaller
        shell: pwsh
        run: .\.venv-build\Scripts\python.exe -m PyInstaller stm32_easy_flash.spec

      - name: Sign Windows executable (optional)
        if: env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
          & signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\stm32_easy_flash.exe
          Remove-Item cert.pfx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-easy-flash-windows
          path: dist/stm32_easy_flash.exe
          retention-days: 30

  build-macos:
    name: Build macOS Executable
    runs-on: macos-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore build environment cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: .venv-build
          key: ${{ runner.os }}-py311-build-${{ hashFiles('requirements/build.txt', 'stm32_easy_flash.spec') }}
          restore-keys: |
            ${{ runner.os }}-py311-build-

      - name: Create build environment and install dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/python -m pip install --upgrade pip
          .venv-build/bin/python -m pip install -r requirements/build.txt

      - name: Build binary with PyInstaller
        run: .venv-build/bin/python -m PyInstaller stm32_easy_flash.spec

      - name: Sign macOS binary (optional)
        if: env.APPLE_CERT_BASE64 != ''
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$APPLE_CERT_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          codesign --force --deep --sign "$APPLE_TEAM_ID" dist/stm32_easy_flash
          xcrun notarytool submit dist/stm32_easy_flash --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          rm -f cert.p12

      - name: Package macOS binary
        run: cd dist && zip -r stm32_easy_flash_macos.zip stm32_easy_flash*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-easy-flash-macos
          path: dist/stm32_easy_flash_macos.zip
          retention-days: 30

  virustotal-scan:
    name: VirusTotal Scan
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: stm32-easy-flash-windows
          path: dist/windows

      - name: Upload to VirusTotal
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: dist/windows/stm32_easy_flash.exe
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write

    steps:
      - name: Prepare release metadata
        id: release-meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v2.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=STM32 Easy Flash $TAG" >> $GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: stm32-easy-flash-windows
          path: dist/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: stm32-easy-flash-macos
          path: dist/macos

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release-meta.outputs.name }}
          body: |
            ## STM32 Easy Flash ${{ steps.release-meta.outputs.tag }}

            ### Download
            | Platform | Datei | Hinweis |
            |----------|-------|---------|
            | Windows  | `stm32_easy_flash.exe` | Direkt ausfuehren, kein Python erforderlich |
            | macOS    | `stm32_easy_flash_macos.zip` | Entpacken und ausfuehren |

            > **macOS Hinweis:** Beim ersten Start muss die App unter
            > *Systemeinstellungen → Datenschutz & Sicherheit → Bedienungshilfen*
            > eingetragen werden, damit der globale Hotkey funktioniert.

            ### Erste Schritte
            1. App starten
            2. Pfade fuer STM32CubeProgrammer CLI und Firmware eintragen
            3. Port auswaehlen (SWD / JTAG / USB1 oder COM-Port aus Dropdown)
            4. Hotkey konfigurieren
               - Windows Standard: `Ctrl+Shift+F12`
               - macOS Standard: `Cmd+Shift+F12`
            5. **Speichern** – Konfiguration wird als `stm32_easy_flash.config.json` neben der App abgelegt
            6. **Programm** klicken oder Hotkey druecken – Ausgabe erscheint live im integrierten Terminal

            ### Voraussetzungen
            - STM32CubeProgrammer am konfigurierten Pfad installiert
            - ST-LINK oder kompatiblen Debug-Adapter angeschlossen
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/windows/stm32_easy_flash.exe
            dist/macos/stm32_easy_flash_macos.zip
