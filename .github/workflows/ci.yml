name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Static Code Analysis
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore lint environment cache
        id: lint-cache
        uses: actions/cache@v4
        with:
          path: .venv-lint
          key: ${{ runner.os }}-py311-lint-${{ hashFiles('requirements/runtime.txt') }}
          restore-keys: |
            ${{ runner.os }}-py311-lint-

      - name: Create lint environment and install dependencies
        if: steps.lint-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv .venv-lint
          .\.venv-lint\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-lint\Scripts\python.exe -m pip install -r requirements/runtime.txt flake8 pylint

      - name: Run flake8 (style & syntax check)
        shell: pwsh
        run: .\.venv-lint\Scripts\python.exe -m flake8 main.py stm32_easy_flash/

      - name: Run pylint (code quality check)
        shell: pwsh
        run: >
          .\.venv-lint\Scripts\python.exe -m pylint main.py stm32_easy_flash/
          --fail-under=7.0
          --disable=import-error

  build:
    name: Build Executable
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore build environment cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: .venv-build
          key: ${{ runner.os }}-py311-build-${{ hashFiles('requirements/build.txt', 'stm32_easy_flash.spec') }}
          restore-keys: |
            ${{ runner.os }}-py311-build-

      - name: Create build environment and install dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-build\Scripts\python.exe -m pip install -r requirements/build.txt

      - name: Build .exe with PyInstaller
        shell: pwsh
        run: .\.venv-build\Scripts\python.exe -m PyInstaller stm32_easy_flash.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-easy-flash-windows
          path: dist/stm32_easy_flash.exe
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Prepare release metadata
        id: release-meta
        shell: pwsh
        run: |
          $tag = "v2.0.${{ github.run_number }}"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=STM32 Easy Flash $tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: stm32-easy-flash-windows
          path: dist

      - name: Create GitHub Release and upload .exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release-meta.outputs.name }}
          body: |
            ## STM32 Easy Flash ${{ steps.release-meta.outputs.tag }}

            ### Download
            Download `stm32_easy_flash.exe` below and run it directly – no Python installation required.

            ### Erste Schritte
            1. `stm32_easy_flash.exe` starten
            2. Pfade fuer STM32CubeProgrammer CLI und Firmware eintragen
            3. Port auswaehlen (SWD / JTAG / USB1 oder COM-Port aus Dropdown)
            4. Hotkey konfigurieren (Standard: `Ctrl+Shift+F12`)
            5. **Speichern** – Konfiguration wird als `stm32_easy_flash.config.json` neben der exe abgelegt
            6. **Programm** klicken oder Hotkey druecken – Ausgabe erscheint live im integrierten Terminal

            ### Voraussetzungen
            - STM32CubeProgrammer am konfigurierten Pfad installiert
            - ST-LINK oder kompatiblen Debug-Adapter angeschlossen
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/stm32_easy_flash.exe
